[project]
name = "contraria-api"
version = "0.1.0"
description = "ContrarIA -- coleta, triagem, detecção de bots, verificação e intervenção contra desinformação política no Bluesky."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "litellm>=1.40",
    "httpx>=0.28.1",
    "feedparser>=6.0.14",
    "pgvector>=0.5.0",
    "ddgs>=9.16.0",
    "sentence-transformers>=3",
    "torch>=2.2",
    "atproto>=0.0.72",
    "curl-cffi>=0.16.3",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
    "scikit-learn>=1.9.1",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "ruff>=0.5",
    "pytest-asyncio>=0.23",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

# Embeddings executados em CPU: não baixar bibliotecas CUDA no Linux/CI.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
