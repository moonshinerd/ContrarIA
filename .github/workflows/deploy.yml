name: Deploy

# Só em push na main, nunca em pull_request: o ambiente `production` também aceita apenas a main.
# A VM não recebe conexões de entrada. O workflow se autentica com o token OIDC do próprio GitHub
# (sem nenhum segredo guardado) e pede o deploy a um endpoint que só aceita este repositório, nesta
# branch e neste workflow (ADR 0020, api/app/deployhook.py).
on:
  push:
    branches:
      - main
    # Mudança só de documentação não precisa reconstruir nada.
    paths-ignore:
      - "docs/**"
      - "mkdocs.yml"
      - "overrides/**"
      - "**.md"
  # Reexecução manual (o ambiente `production` só aceita a main).
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # necessário para pedir o token OIDC

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - name: Pedir o deploy e esperar o resultado
        env:
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
        run: |
          set -euo pipefail
          UA="contraria-deploy/1.0 (github-actions)"

          # Um token novo a cada chamada: ele vale por pouco tempo e carrega a identidade do job.
          oidc_token() {
            curl -sSf -A "$UA" \
              -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=contraria-deploy" | jq -r .value
          }

          tok=$(oidc_token); echo "::add-mask::$tok"
          resp=$(curl -sSf -A "$UA" -X POST -H "Authorization: Bearer $tok" "$DEPLOY_URL/deploy")
          echo "$resp"
          requested=$(echo "$resp" | jq -r .requested_at)

          for i in $(seq 1 120); do
            sleep 10
            tok=$(oidc_token); echo "::add-mask::$tok"
            st=$(curl -sSf -A "$UA" -H "Authorization: Bearer $tok" "$DEPLOY_URL/status" || echo '{}')
            state=$(echo "$st" | jq -r '.state // "unknown"')
            finished=$(echo "$st" | jq -r '.finished_at // ""')
            echo "[$i] estado: $state"
            if [ "$state" = ok ] || [ "$state" = failed ]; then
              # só vale um deploy que terminou depois do pedido (o status guarda o último)
              if [ -n "$finished" ] && [ "$(printf '%s\n%s\n' "$requested" "$finished" | sort | head -1)" = "$requested" ]; then
                echo "$st" | jq .
                [ "$state" = ok ]
                exit $?
              fi
            fi
          done
          echo "Tempo esgotado esperando o deploy terminar."
          exit 1
