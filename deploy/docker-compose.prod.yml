services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-contraria}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-contraria}
      POSTGRES_DB: ${POSTGRES_DB:-contraria}
    # No exposed ports to host for security
    volumes:
      - contraria-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-contraria} -d ${POSTGRES_DB:-contraria}"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 512m

  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    volumes:
      - ../searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080/
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 256m

  # Uma única cópia do modelo Jev em memória; api e worker o chamam por HTTP.
  jev:
    build: ../api
    restart: unless-stopped
    env_file: ../api/.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-contraria}:${POSTGRES_PASSWORD:-contraria}@db:5432/${POSTGRES_DB:-contraria}
    volumes:
      - contraria-model-cache:/root/.cache/huggingface
    command: uvicorn app.jev_server:app --host 0.0.0.0 --port 8100
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health')"]
      interval: 10s
      timeout: 5s
      retries: 30
    mem_limit: 4g

  api:
    build: ../api
    restart: unless-stopped
    env_file: ../api/.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-contraria}:${POSTGRES_PASSWORD:-contraria}@db:5432/${POSTGRES_DB:-contraria}
      BLUESKY_SESSION_PATH: /srv/data/bluesky.session
      JEV_SERVER_URL: http://jev:8100
      SEARXNG_BASE_URL: http://searxng:8080
    depends_on:
      db:
        condition: service_healthy
      jev:
        condition: service_healthy
      searxng:
        condition: service_healthy
    volumes:
      - contraria-model-cache:/root/.cache/huggingface
      - contraria-app-data:/srv/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 1g

  worker:
    build: ../api
    restart: unless-stopped
    env_file: ../api/.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-contraria}:${POSTGRES_PASSWORD:-contraria}@db:5432/${POSTGRES_DB:-contraria}
      BLUESKY_SESSION_PATH: /srv/data/bluesky.session
      JEV_SERVER_URL: http://jev:8100
      SEARXNG_BASE_URL: http://searxng:8080
    depends_on:
      db:
        condition: service_healthy
      jev:
        condition: service_healthy
      searxng:
        condition: service_healthy
    volumes:
      - contraria-model-cache:/root/.cache/huggingface
      - contraria-app-data:/srv/data
    command: python -m app.worker
    # 1g ficava a ~90% de uso (o worker carrega o modelo de embeddings do pré-filtro).
    mem_limit: 2g

  # Serviço oficial de labeler AT Protocol. Usa banco próprio, conforme o guia
  # de hospedagem do Ozone, para isolar seus dados de moderação da aplicação.
  ozone-db:
    image: postgres:14.11-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${OZONE_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${OZONE_POSTGRES_PASSWORD:?Defina OZONE_POSTGRES_PASSWORD}
      POSTGRES_DB: ${OZONE_POSTGRES_DB:-ozone}
    volumes:
      - ozone-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 512m

  ozone:
    image: ghcr.io/bluesky-social/ozone:0.1
    restart: unless-stopped
    environment:
      OZONE_SERVER_DID: ${OZONE_LABELER_DID:?Defina OZONE_LABELER_DID}
      OZONE_PUBLIC_URL: https://${OZONE_DOMAIN:?Defina OZONE_DOMAIN}
      OZONE_ADMIN_DIDS: ${OZONE_ADMIN_DIDS:-${OZONE_LABELER_DID}}
      OZONE_ADMIN_PASSWORD: ${OZONE_ADMIN_PASSWORD:?Defina OZONE_ADMIN_PASSWORD}
      OZONE_SIGNING_KEY_HEX: ${OZONE_SIGNING_KEY_HEX:?Defina OZONE_SIGNING_KEY_HEX}
      OZONE_DB_POSTGRES_URL: postgresql://${OZONE_POSTGRES_USER:-postgres}:${OZONE_POSTGRES_PASSWORD}@ozone-db:5432/${OZONE_POSTGRES_DB:-ozone}
      OZONE_DB_MIGRATE: "1"
      OZONE_DID_PLC_URL: https://plc.directory
      OZONE_APPVIEW_URL: https://api.bsky.app
      OZONE_APPVIEW_DID: did:web:api.bsky.app
      LOG_ENABLED: "1"
    # Só em loopback: o acesso externo vem do túnel Cloudflare (ver deploy/README.md).
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      ozone-db:
        condition: service_healthy
    mem_limit: 1g

  ozone-daemon:
    image: ghcr.io/bluesky-social/ozone:0.1
    restart: unless-stopped
    command: ["node", "./service/daemon.js"]
    environment:
      OZONE_SERVER_DID: ${OZONE_LABELER_DID:?Defina OZONE_LABELER_DID}
      OZONE_PUBLIC_URL: https://${OZONE_DOMAIN:?Defina OZONE_DOMAIN}
      OZONE_ADMIN_DIDS: ${OZONE_ADMIN_DIDS:-${OZONE_LABELER_DID}}
      OZONE_ADMIN_PASSWORD: ${OZONE_ADMIN_PASSWORD:?Defina OZONE_ADMIN_PASSWORD}
      OZONE_SIGNING_KEY_HEX: ${OZONE_SIGNING_KEY_HEX:?Defina OZONE_SIGNING_KEY_HEX}
      OZONE_DB_POSTGRES_URL: postgresql://${OZONE_POSTGRES_USER:-postgres}:${OZONE_POSTGRES_PASSWORD}@ozone-db:5432/${OZONE_POSTGRES_DB:-ozone}
      OZONE_DB_MIGRATE: "1"
      OZONE_DID_PLC_URL: https://plc.directory
      OZONE_APPVIEW_URL: https://api.bsky.app
      OZONE_APPVIEW_DID: did:web:api.bsky.app
      LOG_ENABLED: "1"
    depends_on:
      ozone:
        condition: service_started
    mem_limit: 512m


volumes:
  contraria-db-data:
  contraria-model-cache:
  contraria-app-data:
  ozone-db-data:
