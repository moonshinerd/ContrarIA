site_name: ContrarIA
site_description: Agente de mitigação de desinformação e detecção de bots no Bluesky
repo_url: https://github.com/moonshinerd/ContrarIA
edit_uri: edit/main/docs/
docs_dir: docs

theme:
  name: material
  language: pt-BR
  features:
    - navigation.sections
    - navigation.top
    - content.action.edit
    - search.suggest
  palette:
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Modo escuro
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Modo claro

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Início: index.md
  - Planejamento: planejamento.md
  - Requisitos: requisitos.md
  - Arquitetura:
      - Visão Geral: arquitetura/index.md
      - O Pipeline do Agente: arquitetura/pipeline.md
  - Decisões (ADRs):
      - Índice: adr/index.md
      - "0001 – Bluesky": adr/0001-bluesky.md
      - "0002 – Quote Post": adr/0002-quote-post.md
      - "0003 – Labeler Ozone": adr/0003-labeler-ozone.md
      - "0004 – LiteLLM e OpenRouter": adr/0004-litellm-openrouter.md
      - "0005 – Fontes de Evidência": adr/0005-multiplas-fontes-evidencia.md
      - "0006 – Bot Score Heurístico": adr/0006-bot-score-heuristico.md
      - "0007 – Verificação Multiagente": adr/0007-verificacao-cove-selfrag-mad-crc.md
      - "0008 – Pré-filtro Clássico": adr/0008-pre-filtro-classico.md
      - "0009 – Coleta Híbrida": adr/0009-coleta-hibrida-jetstream-searchposts.md
      - "0010 – Frontend fora do MVP": adr/0010-frontend-fora-do-mvp.md
      - "0011 – Deploy em VPS": adr/0011-deploy-vps-caddy-cloudflare.md
      - "0012 – Organização sem Sprints": adr/0012-organizacao-sem-sprints.md
  - Atas:
      - atas/index.md
      - "09/09 – Alinhamento (Engage)": atas/ata01.md
