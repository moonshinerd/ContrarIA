site_name: ContrarIA
site_description: Agente de mitigação de desinformação e detecção de bots no Bluesky
repo_url: https://github.com/moonshinerd/ContrarIA
edit_uri: edit/main/docs/
docs_dir: docs

theme:
  name: material
  language: pt-BR
  features:
    - navigation.sections
    - navigation.top
    - content.action.edit
    - search.suggest
  palette:
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Modo escuro
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Modo claro

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Início: index.md
  - Planejamento: planejamento.md
  - Requisitos: requisitos.md
  - Pesquisa:
      - Matrizes de Decisão: pesquisa/matrizes.md
  - Arquitetura: arquitetura/index.md
  - Decisões (ADRs): adr/index.md
  - Glossário: glossario.md
  - Atas:
      - Índice: atas/index.md
      - "09/09 – Alinhamento (Engage)": atas/ata01.md
      - "16/09 – Planejamento do MVP": atas/ata02.md
      - Checkpoints do MVP: atas/checkpoints.md
