# Ambiente de desenvolvimento: db (Postgres + pgvector), api (FastAPI com
# hot-reload) e worker (pipeline em loop), os dois últimos na mesma imagem.
# Produção (Caddy + HTTPS + Ozone) fica em deploy/ -- ver issue de deploy.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: contraria
      POSTGRES_PASSWORD: contraria
      POSTGRES_DB: contraria
    ports:
      - "5432:5432"
    volumes:
      - contraria-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contraria -d contraria"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    env_file: ./api/.env
    environment:
      DATABASE_URL: postgresql+psycopg://contraria:contraria@db:5432/contraria
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./api/app:/srv/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build: ./api
    env_file: ./api/.env
    environment:
      DATABASE_URL: postgresql+psycopg://contraria:contraria@db:5432/contraria
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./api/app:/srv/app
    command: python -m app.worker

volumes:
  contraria-db-data:
